name: Build LuminaGrade Windows EXE

on:
  push:
    branches: [lumina-grade]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Build portable EXE
        shell: pwsh
        run: |
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source
          pyinstaller --noconfirm --clean --onefile --windowed --name "LuminaGrade" `
            --add-binary "$ffmpeg;." `
            --add-binary "$ffprobe;." `
            app.py

      - name: Smoke test EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/LuminaGrade.exe")) { throw "LuminaGrade.exe was not created" }
          Get-Item "dist/LuminaGrade.exe" | Format-List Name,Length,FullName

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/LuminaGrade.exe","README-LuminaGrade.md" -DestinationPath "LuminaGrade-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaGrade-Windows
          path: LuminaGrade-Windows.zip
          if-no-files-found: error
          retention-days: 30
