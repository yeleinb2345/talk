name: Build LuminaGrade Windows EXE

on:
  push:
    branches: [lumina-grade]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install real FFmpeg binaries
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $tools = Join-Path $env:ChocolateyInstall "lib\ffmpeg\tools"
          $ffmpeg = Get-ChildItem -Path $tools -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty FullName
          $ffprobe = Get-ChildItem -Path $tools -Recurse -Filter "ffprobe.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (!$ffmpeg -or !(Test-Path $ffmpeg)) { throw "Real ffmpeg.exe not found under $tools" }
          if (!$ffprobe -or !(Test-Path $ffprobe)) { throw "Real ffprobe.exe not found under $tools" }
          if ((Get-Item $ffmpeg).Length -lt 1000000) { throw "ffmpeg.exe looks like a Chocolatey shim: $ffmpeg" }
          if ((Get-Item $ffprobe).Length -lt 1000000) { throw "ffprobe.exe looks like a Chocolatey shim: $ffprobe" }
          & $ffmpeg -version
          & $ffprobe -version
          "LUMINAGRADE_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LUMINAGRADE_FFPROBE=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "LuminaGrade" `
            --add-binary "$env:LUMINAGRADE_FFMPEG;." `
            --add-binary "$env:LUMINAGRADE_FFPROBE;." `
            app.py

      - name: Smoke test EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/LuminaGrade.exe")) { throw "LuminaGrade.exe was not created" }
          Get-Item "dist/LuminaGrade.exe" | Format-List Name,Length,FullName

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/LuminaGrade.exe","README-LuminaGrade.md" -DestinationPath "LuminaGrade-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaGrade-Windows
          path: LuminaGrade-Windows.zip
          if-no-files-found: error
          retention-days: 30
